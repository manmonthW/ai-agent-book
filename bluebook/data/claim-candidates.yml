    text: "具体做法是让学生的预测分布贴近教师分布，通常最小化两者的 **KL 散度**。例如学生生成 “先查询 API，再解析返回值……” 时，教师可以在 “查询” 这个 token 的位置给出“查询”80%、“调用”15%、其余 5% 的 token 分布。相比最终成败的二元奖励，逐 token 对齐提供了密集得多、方差更低的学习信号；代价是教师推理成本，因此在环境交互昂贵时尤其划算。"
