  - id: "candidate-0114"
    source: "primary"
    path: "book/chapter2.md"
    line: 949
    text: "**实现一：每轮替换**。每次 API 调用前，从消息列表中移除上一轮的状态消息，在末尾追加最新状态。这保证了上下文中只有一份状态、永远是最新的。但代价是：移除旧状态会使其位置之后的所有缓存失效——这与本章批评的 “动态时间戳” 是同一个失效机制，区别只在于状态消息位于上下文末尾，失效范围只覆盖上次注入后新增的消息（通常是一轮），整个前缀仍可复用。"
    signals: "['(?:提升|降低|减少|增加|优于|超过|翻倍|显著|最新|首次|第一)']"
    review_status: "pending"
