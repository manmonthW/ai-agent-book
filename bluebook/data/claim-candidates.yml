    text: "Cordis 的思路是把两个原本属于编译期的概念提升到运行时。效果系统本来用于推理 “计算如何修改环境”，被提升为**可撤销效果**：每一次对上下文的变换都携带一个显式的逆操作，由运行时追踪，组件移除时上下文随之恢复。协效果（coeffect）系统本来用于推理 “计算对环境有什么要求”，被提升为**反应式协效果**：组件把自己需要的依赖声明成一份规格，上下文每次变化都按这份规格通知它激活、失活还是无关。论文进一步用一套动态组合演算，把这个性质从单个组件推广到相互交错的组件系统——可组合性必须是可传递的。"
