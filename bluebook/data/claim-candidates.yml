  - id: "candidate-0115"
    source: "primary"
    path: "book/chapter2.md"
    line: 951
    text: "**实现二：持久追加**。状态消息一旦注入就永久留在轨迹中，每轮只在末尾追加新的状态。Claude Code 的 `<system-reminder>` 采用的就是这种方式——历史状态消息保留在会话记录（transcript）中，从不删改。这种方式对缓存完全友好：所有消息只追加、不修改，前缀始终稳定。代价是陈旧的状态会在上下文中累积，既占用 token，也要求模型自己关注 “最新一条” 状态而忽略已过时的旧状态。"
