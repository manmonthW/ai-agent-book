    text: "第一章的框架对比表把 DeepSeek Harness（`dsh`）归为 “Agent 自进化框架”[^dsh-2026]。它的底座 Cordis 论文指出，传统意义上的组合是**静态**的，函数调用、模块导入和类继承都在编译期确定，运行期不再变化；而插件系统和自进化 Harness 需要的是**动态组合**，组件要在运行中被装入、卸下和重新配置[^cordis-2026]。Agent 的每一次自我修改，本质上都是一次动态组合。"
