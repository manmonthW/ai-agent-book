    text: "**两个 Agent 应优先使用能力相近但来自不同家族的模型。** 例如 Proposer 用 Claude，Reviewer 用 GPT；或者 Proposer 用 DeepSeek，Reviewer 用 Kimi。不同的训练数据、偏好和推理习惯可降低两者在同一处犯同类错误的概率；能力则不宜悬殊，否则 Reviewer 可能根本跟不上 Proposer 对复杂证据的处理。这种“异源互审”能增加独立性，但不能替代原始证据：Reviewer 应主要核对证据和 diff，而不是沿着 Proposer 的结论再讲一遍。权限上也应强制分工：Proposer 只能写工作分支，Reviewer 只读证据并提交审核结果，只有合并流程可以更新主分支和线上索引。"
