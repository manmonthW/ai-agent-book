    text: "第一章把上下文比作 Agent 的“眼睛”——Agent 只能基于它看到的信息做决策。上下文的设计和管理称为**上下文工程（Context Engineering）**。所谓上下文，就是每次你和 AI 对话时，AI 实际“看到”的全部信息。它不仅包含你们之前聊了什么（对话历史），还包含开发者预先写好的行为规则（系统指令）、AI 可以使用的外部功能说明（工具描述）等各类信息。从第一章引入的 Harness 工程视角来看，上下文工程是 Harness 中“上下文与工具”层面的核心实现，它决定了 Agent 在每个决策点能看到什么信息、以什么样的结构看到这些信息。一个设计精良的上下文就是一套高效的信息供给系统，让 Agent 的通用思考能力得以在具体任务中充分发挥。"
