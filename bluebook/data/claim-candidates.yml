    text: "> **因子分析**阶段没有直接让 AI 预测刑期（那样会产生一个“黑箱”——能给出答案但说不清为什么），而是先把案件信息翻译成计算机擅长处理的数字格式。翻译方法很直观：对于“犯罪类型”这样有多个选项的字段，给每个选项一个独立的开关位——盗窃 = [1,0,0]、抢劫 = [0,1,0]、诈骗 = [0,0,1]（之所以不用 1、2、3，是因为数字大小会让算法误以为“诈骗比盗窃严重 3 倍”，而开关位只表示“是哪一类”，不暗示大小关系）。对于“是否自首”、“是否赔偿”这样的是非题，1 表示是、0 表示否。这样每个案件就变成一串数字，然后利用聚类算法在数据中寻找自然的“案件原型”。例如，把故意伤害罪的案件放在一起聚类，算法会依据冲突起因、作案方式、伤害后果等特征，把它们分成若干组内部相似的案件，每一组就是一种典型模式，如“轻微口角引发的徒手斗殴致人轻伤”、“有预谋的团伙持械围殴致人重伤”。通过分析定义聚类的关键特征，构建数据驱动的“因子重要性层次模型”。"
