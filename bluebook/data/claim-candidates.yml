  - id: "candidate-0232"
    source: "primary"
    path: "book/chapter4.md"
    line: 365
    text: "解决这一问题的核心是**幂等性**：同一个操作执行一次和执行多次，对外部世界的影响完全相同，因而可以安全重试。设计上有两条常用手段：其一是让操作携带**唯一标识**，服务端凭此去重，重复请求直接返回首次结果而非再次执行；其二是**先查询后变更**——重试前先查询目标资源的当前状态（订单是否已创建、文件是否已写入），确认未完成再执行。具备幂等性的操作让超时与打断的处理简单得多。"
    signals: "['(?:提升|降低|减少|增加|优于|超过|翻倍|显著|最新|首次|第一)']"
