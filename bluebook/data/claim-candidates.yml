    text: "这些方法并非 Pine 所独有。许多模型与 Agent 团队在解决相似问题时，都独立形成了相近的工程方法；这种趋同说明，它们反映的是 Agent 系统的共性约束。基于这些认识，我于 2025 年在图灵开设《AI Agent 实战营》，并于 2024—2026 年持续在中国科学院大学讲授 AI Agent 实践课程。本书选择开源发布，也希望让这些可复用的知识和经验服务于更多研究者与工程实践者。"
