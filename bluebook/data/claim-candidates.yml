    text: "**在轨蒸馏**（On-Policy Distillation）由 Thinking Machines Lab 于 2025 年系统整理并推广[^ch8-10]。这里的 “policy” 指**谁生成学生将要学习的状态前缀**，不是指谁提供监督："
