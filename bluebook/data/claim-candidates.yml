  - id: "candidate-0075"
    source: "primary"
    path: "book/chapter2.md"
    line: 536
    text: "使用 KV Cache 时，每个 token 的 K、V 只在它第一次进入上下文时计算一次，之后一直留在缓存里。生成 E 这一步，A、B、C、D 的 4 组 K、V 已经在缓存中，直接取用即可完成注意力计算；等 E 被采样出来、送回模型之后，才计算 E 自身的 K、V 并追加进缓存，缓存增长到 5 组，用于生成第 6 个 token。需要注意的是，KV Cache 省去的是历史 token 的 K、V 投影重算，使每步解码不必重算整个前缀；但每个新 token 的注意力计算仍要遍历全部缓存的 K、V，计算量随上下文长度线性增长——这正是长上下文解码越来越慢、KV Cache 的显存与带宽成为推理瓶颈的原因。"
