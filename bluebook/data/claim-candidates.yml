  - id: "candidate-0493"
    source: "primary"
    path: "book/chapter9.md"
    line: 3
    text: "今天的 Agent 面临一个鲜明的能力悖论：它可以零样本解决从未见过的复杂任务，却可能在处理了一万次相似任务之后，第二天仍然犯下第一天的错误。模型上岗之后，能否像新员工一样从日常工作中不断长进？**能否自主从经验中学习**（所谓**持续学习**，continual learning），正在成为 Agent 从“会完成任务”走向“能够可靠工作”的关键能力，也是下一代模型的核心研究课题。今天的 “持续学习” 概念与早年 “学了新任务就忘掉旧任务” 的持续学习研究不是同一个问题，遗忘只是其中一个子问题，更难的是没有人告诉模型，今天这一天的经历里哪些是做对的，哪些是做错的。就目前而言，模型本身的持续学习能力仍远远不够。"
    signals: "['(?:提升|降低|减少|增加|优于|超过|翻倍|显著|最新|首次|第一)']"
    review_status: "pending"
    disposition: null
  - id: "candidate-0494"
    source: "primary"
    path: "book/chapter9.md"
    line: 9
    text: "那么，为什么不让模型在每次任务后直接训练自己？因为生产环境很少提供干净的学习信号。用户满意不意味着合规；局部参数更新还可能造成能力遗忘、策略漂移或安全退化。若允许模型依据未经验证的反馈直接修改自身参数，错误经验和提示注入就可能被固化，并在后续任务中持续放大。另一方面，基础模型的周期性训练可以提升通用能力，却无法及时吸收每个 Agent 每天遇到的私有规则、工具变化和局部经验。"
    signals: "['(?:提升|降低|减少|增加|优于|超过|翻倍|显著|最新|首次|第一)']"
