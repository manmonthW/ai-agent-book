    text: "核心设计是 **L0/L1/L2 三层上下文按需加载**。资源写入时，系统自动将原始内容提炼为三个抽象层次：**L0（摘要）**约 100 tokens 的一句话概述，用于快速判断目录相关性；**L1（概览）**约 2,000 tokens 的核心信息与使用场景，供 Agent 规划决策；**L2（全文）**为完整原始内容，仅在需要深入时按需加载。每个目录下自动生成 `.abstract`（L0）和 `.overview`（L1）文件，形成从根到叶的层次化摘要结构。若在 L0 层即判定无关，则无需加载 L1 和 L2——大部分查询加载到 L1 即可完成决策，Token 消耗因此大幅降低。这套“摘要常驻、按需取全文”的思路，与第二章介绍的 Skills 渐进式披露（progressive disclosure）如出一辙——都是先让 Agent 只看到轻量的元信息，确有需要时再逐层拉取完整内容，把 Token 花在刀刃上。"
