    text: "> 实验结果揭示了每个上下文组件的作用，也揭示了它们并不同等重要。**工具定义**（Tool Definitions，静态前缀的一部分）是 Agent 行动能力的基础，没有它就无法调用任何工具；但失去行动能力不等于沉默——模型照样会给出一份格式工整、语气笃定的答案，数据却来自参数记忆，与真正基于观测得出的答案排版一模一样。它是坦白拒绝还是就地编造，主要取决于模型自身的幻觉率与诚实度；提示词里“不得自行估计”这类约束只能降低编造的概率，并不能消除。**工具执行结果**（Tool Results）是闭环控制的关键，缺失它会让 Agent “盲目”执行，反复重试直到耗尽迭代预算。**思考过程**（模型回复中的 reasoning 部分）记录的是“为什么这么做”，工具执行结果记录的是“发生了什么”；当前者可以从后者重建时，把它从历史中丢掉几乎没有代价。**历史消息**（之前轮次的用户消息、模型回复和工具执行结果）则防止了冗余操作，避免重复犯同样的错误。"
