    text: "为什么追加到末尾就不破坏缓存？这正是前文 KV Cache 前缀性质的直接推论：因果注意力决定了每个 token 在每一层的隐状态（以及由它算出的 K、V）只依赖该 token 自身和它之前的 token，与后面的 token 无关，因此在末尾追加新内容不会改变任何已缓存 token 的 K、V——新增的工具 schema 只需在首次出现时计算一次（一次性的缓存写入），此后就并入不断增长的“前缀”，在后续所有轮次持续命中。所以这不是“预编译”，而是“只增不改”的追加式注入。"
