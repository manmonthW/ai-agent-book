  - id: "candidate-0503"
    source: "primary"
    path: "book/chapter9.md"
    line: 103
    text: "系统提示学习与第二章的提示工程不是一回事。第二章讨论怎样组织一份好 Prompt；本节讨论什么反馈足以触发修改，以及更新提案怎样安全发布。修改应是带来源的最小 diff，而不是让模型每次都重写整份 Prompt——这正是第一章命名的最小 diff + 可回滚模式。待验证版本必须同时在**触发失败的边界集**和**正常工作的保留集**上测试，前者要改善，后者不能退化。"
    signals: "['(?:提升|降低|减少|增加|优于|超过|翻倍|显著|最新|首次|第一)']"
