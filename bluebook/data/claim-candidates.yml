    text: "实验表明[^ch2-8]，为模型提供一条**提前算好的状态栏**后，**较小开源模型的准确率可以接近前沿大模型**。此外，**状态栏可以大大提高模型的思考效率**，让每次 Agent 迭代的思考 token 量、延迟和花费均降低约一个数量级。不带状态栏时，每次查询的思考量随上下文变长而**持续增长**；带上状态栏后，它变得**基本恒定**。"
