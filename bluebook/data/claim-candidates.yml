    text: "上下文腐化与上下文溢出（窗口用完）是不同的问题：溢出是 “装不下了”，腐化是 “装得下但找不到了”——后者更隐蔽，因为 Agent 表面上还在正常工作，只是决策质量悄然下降。随着上下文长度的增加，注意力权重被分散到更多的 token 上，每个 token 获得的权重变小；更关键的是，无关的内容一旦占到了上下文的大头，Agent 的决策质量就会明显下滑。偶尔才用到的知识每次都加载、稳定的规则和动态的状态混在一起，模型能看到的内容越来越多，但真正有用的部分越来越难被注意到。这就好比在一个巨大的图书馆里找某本书，书架上摆的无关书籍越多，找到目标就越难。"
