    line: 7
    text: "自 2025 年初 DeepSeek R1 发布以来，AI 研究与产业实践的重心逐步从基座模型能力扩展到 Agent 的系统化落地。在模型侧，智能体强化学习（Agentic Reinforcement Learning）开始将工具调用及环境交互能力内化到模型参数中，使模型在编程（coding）、数学推理和图形界面操作（computer use）等领域表现出更强的通用能力。在产品侧，Manus、Claude Code、OpenClaw 等通用 Agent 则推动了人机交互方式的变化，并使“代码生成 + 文件系统”成为重要的系统架构范式。"
