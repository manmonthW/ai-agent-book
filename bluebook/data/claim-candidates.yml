    text: "要理解 KV Cache 的价值，先看看没有它时会发生什么。假设一个 Agent 在进行第 6 轮对话，上下文已经累积了 2000 个 token。在没有缓存的情况下，模型每生成一个新 token，都需要重新计算这 2000 个 token 的 K、V 向量——相当于重跑整个前缀的前向计算。尽管前 5 轮的内容完全没变，第 6 轮仍要像第 1 轮那样从头计算整个前缀，而且此时前缀更长，代价比第 1 轮大得多。无缓存时，prefill 阶段（即模型生成回复之前，处理输入的全部 token 的阶段）的注意力计算量随上下文长度平方级增长，随着对话深入，延迟和成本都会急剧攀升。这对于需要几十轮工具调用的 Agent 任务来说是不可接受的。"
