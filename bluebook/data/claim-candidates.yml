    text: "这个发现打开了两种以前认为不可能的操作。其一是**编辑**（Editing）：既然结论已经写进了下游笔记，那么改掉一个字段后，只要模型有显式的思考链（CoT），就能让这处改动顺着已缓存的思考传播下去，用大约 1% 的算力得到与“整段重算”一致的结果（反过来，如果没有 CoT，孤立地改字段会被忽略——因为结论早已固化在下游状态中，却没有一条思考路径去更新它，这是一条重要的边界）。其二是**组合**（Composition）：把一段预先算好的“技能”缓存，通过旋转位置编码（RoPE）挪到新的位置，直接拼接进另一段上下文，而不必重新计算注意力——于是“用模块化的缓存块拼出一个长上下文”从 O(L²) 的重算降到 O(L) 的拼接，所得结果却与完整重算难以区分。"
