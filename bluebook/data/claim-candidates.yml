    text: "本节前面的讨论都建立在一条铁律上：前缀里改一个字节，后面的缓存就全废。这条铁律在今天的推理引擎里确实成立，但笔者想指出，它未必是**必然**的。松动它的出发点，是一个反直觉的观察[^ch2-2]：在 prefill 阶段，模型其实在“做笔记”。当它读到上下文里的某个字段（比如“用户所在城市：北京”）时，并不是把这个字段原封不动地缓存下来，而是顺手把“这个字段意味着什么”的**结论**写进了后面每一层的 KV 状态里。测量发现，一个字段**自己**那几个 token 的 KV，对最终决策的贡献往往不到 1%——真正影响输出的，是它在下游留下的那些“读书笔记”。"
