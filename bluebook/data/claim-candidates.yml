  - id: "candidate-0502"
    source: "primary"
    path: "book/chapter9.md"
    line: 101
    text: "Andrej Karpathy 将这种做法称为**系统提示学习**（System Prompt Learning）[^karpathy-system-prompt-learning]：模型遇到问题后，用一句清楚的话提醒未来的自己。DSPy[^dspy-2023] 在开发集上搜索指令和示例；OPRO[^opro-2023] 根据历史提示词及其得分提出提示提案；GEPA[^gepa-2025] 从失败轨迹的自然语言反思中生成并筛选提示提案。这些方法适合离线批量优化；生产环境更适合使用可审计的最小更新提案，并保留快速回滚路径。"
    signals: "['\\\\b(?:19|20)\\\\d{2}\\\\b']"
    review_status: "pending"
