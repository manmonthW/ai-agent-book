version: 1
status: "draft_governed"
terms:
  - id: "agent"
    zh: "AI Agent"
    en: "AI Agent"
    authority_chapter: 1
    definition: "能够根据上下文选择行动、通过工具接收环境反馈并持续推进目标的系统。"
    review_status: "draft"
  - id: "model"
    zh: "模型"
    en: "Model"
    authority_chapter: 1
    definition: "负责语义理解、推理和候选决策；不承担最终授权。"
    review_status: "draft"
  - id: "harness"
    zh: "Agent Harness"
    en: "Agent Harness"
    authority_chapter: 9
    definition: "环绕模型的运行与治理层，管理上下文、工具、状态、权限、预算、验证和纠正。"
    review_status: "draft"
  - id: "environment"
    zh: "环境"
    en: "Environment"
    authority_chapter: 1
    definition: "Agent 外部的真实或仿真状态及其转移规律。"
    review_status: "draft"
  - id: "context"
    zh: "上下文"
    en: "Context"
    authority_chapter: 4
    definition: "一次模型决策时可见的策略、目标、状态、证据、历史和工具定义。"
    review_status: "draft"
  - id: "memory"
    zh: "记忆"
    en: "Memory"
    authority_chapter: 5
    definition: "跨交互保留且受来源、权限、更新和删除政策治理的信息。"
    review_status: "draft"
  - id: "rag"
    zh: "检索增强生成"
    en: "Retrieval-Augmented Generation"
    authority_chapter: 5
    definition: "从外部知识源检索证据并注入当前决策上下文。"
    review_status: "draft"
  - id: "tool"
    zh: "工具"
    en: "Tool"
    authority_chapter: 6
    definition: "Agent 感知或改变环境的受控接口。"
    review_status: "draft"
  - id: "skill"
    zh: "Agent Skill"
    en: "Agent Skill"
    authority_chapter: 4
    definition: "可按需披露的复用知识和流程说明，不构成硬权限边界。"
    review_status: "draft"
  - id: "workflow"
    zh: "工作流"
    en: "Workflow"
    authority_chapter: 2
    definition: "执行步骤和主要转移由程序预先定义的编排。"
    review_status: "draft"
  - id: "react"
    zh: "ReAct 循环"
    en: "Reasoning and Acting Loop"
    authority_chapter: 3
    definition: "模型决策、工具行动和环境观察反复交替的执行循环。"
    review_status: "draft"
  - id: "trajectory"
    zh: "运行轨迹"
    en: "Trajectory"
    authority_chapter: 3
    definition: "一次运行中的输入、模型决策、工具调用、观察和状态变化序列。"
    review_status: "draft"
  - id: "artifact"
    zh: "产物"
    en: "Artifact"
    authority_chapter: 3
    definition: "可持久引用的中间或最终成果，而非必须反复装入上下文的消息。"
    review_status: "draft"
  - id: "evaluation"
    zh: "评估"
    en: "Evaluation"
    authority_chapter: 10
    definition: "通过数据集、环境和评分方法判断结果、轨迹及系统行为。"
    review_status: "draft"
  - id: "observability"
    zh: "可观测性"
    en: "Observability"
    authority_chapter: 10
    definition: "通过 Trace、Span、指标和日志使系统运行可见和可诊断。"
    review_status: "draft"
  - id: "mcp"
    zh: "模型上下文协议"
    en: "Model Context Protocol"
    authority_chapter: 6
    definition: "连接应用或 Agent 与工具、资源的互操作协议。"
    review_status: "draft"
  - id: "a2a"
    zh: "Agent 间协议"
    en: "Agent-to-Agent Protocol"
    authority_chapter: 14
    definition: "支持跨 Agent 任务委派、状态和消息协作的协议。"
    review_status: "draft"
  - id: "multi_agent"
    zh: "多 Agent 系统"
    en: "Multi-Agent System"
    authority_chapter: 14
    definition: "由多个具有独立上下文、身份、权限或任务所有权的 Agent 组成的系统。"
    review_status: "draft"
  - id: "approval"
    zh: "人工审批"
    en: "Human Approval"
    authority_chapter: 11
    definition: "人在高影响动作执行前对明确、可核验的动作载荷作出允许或拒绝。"
    review_status: "draft"
  - id: "idempotency"
    zh: "幂等"
    en: "Idempotency"
    authority_chapter: 9
    definition: "同一逻辑操作重复提交不会产生重复副作用。"
    review_status: "draft"
